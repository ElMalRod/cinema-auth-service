server:
  port: 8081

spring:
  kafka:
    bootstrap-servers: 18.188.55.33:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  application:
    name: cinema-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

auth:
  jwt:
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  security:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}
  reset-token:
    expiration-minutes: ${AUTH_RESET_TOKEN_EXPIRATION_MINUTES:30}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

notifications:
  brevo:
    enabled: ${BREVO_ENABLED:true}
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:noreply@cinema.local}
    sender-name: ${BREVO_SENDER_NAME:cinema}
